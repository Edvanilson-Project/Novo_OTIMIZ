events {
  worker_connections 1024;
}

http {
  # Rate limiting zones (defined at http level, used in location blocks)
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_optimize:10m rate=1r/m;

  # Security headers (applied to all responses)
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP: allow self, specific CDNs used by the app; no inline scripts.
  # Adjust script-src if Next.js requires 'unsafe-inline' for hydration.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self' data:; frame-ancestors 'none';" always;

  # Hide nginx version
  server_tokens off;

  # Gzip
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # Limit request body (prevents upload abuse; large imports go through chunked upload)
  client_max_body_size 10m;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS — Frontend + API
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Frontend
    location / {
      limit_req zone=api_general burst=50 nodelay;
      proxy_pass         http://frontend:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — strict rate limiting
    location ~ ^/api/v1/auth/(login|refresh) {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass         http://backend:3001;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Optimization endpoint — very strict (1 req/min per IP at nginx level)
    location /api/v1/operations/optimize {
      limit_req zone=api_optimize burst=3 nodelay;
      proxy_pass         http://backend:3001;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # General Backend API
    location /api/ {
      limit_req zone=api_general burst=100 nodelay;
      proxy_pass         http://backend:3001;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # WebSocket for optimization events
    location /socket.io/ {
      proxy_pass         http://backend:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 86400s;
    }
  }
}
