[pytest]
# Coleta padrão + suítes de prova reais que não usam prefixo test_
# (proof_of_optimization_suite e qa_advanced são verificadas verdes; audit_correctness
#  está com API antiga/quebrada e precisa de reescrita antes de entrar aqui).
python_files = test_*.py proof_of_optimization_suite.py qa_advanced_2026.py audit_correctness.py
markers =
    timeout: Mark a test with a timeout in seconds.
    slow: Benchmark paralelo ou testes longos — excluídos do CI (use -m slow para rodar localmente).
