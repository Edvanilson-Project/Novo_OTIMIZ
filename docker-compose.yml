services:
  postgres:
    image: postgres:16-alpine
    container_name: otimiz-v2-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-otimiz_db}
      POSTGRES_USER: ${DB_USER:-otimiz_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-otimiz_password}
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - otimiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-otimiz_admin} -d ${DB_NAME:-otimiz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: otimiz-v2-redis
    restart: always
    ports:
      - "6388:6379"
    networks:
      - otimiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: otimiz-v2-optimizer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-otimiz_admin}
      - DB_PASSWORD=${DB_PASSWORD:-otimiz_password}
      - DB_NAME=${DB_NAME:-otimiz_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTERNAL_OPTIMIZER_KEY=${INTERNAL_OPTIMIZER_KEY:-internal-key-123456}
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - otimiz-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otimiz-v2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=12288
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-otimiz_admin}
      - DB_PASSWORD=${DB_PASSWORD:-otimiz_password}
      - DB_NAME=${DB_NAME:-otimiz_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-otimiz-dev-jwt-secret-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - OPTIMIZER_URL=http://optimizer:8000
      - INTERNAL_OPTIMIZER_KEY=${INTERNAL_OPTIMIZER_KEY:-internal-key-123456}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "3001:3001"
    networks:
      - otimiz-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: otimiz-v2-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001/api/v1
    ports:
      - "3000:3000"
    networks:
      - otimiz-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  otimiz-network:
    driver: bridge

volumes:
  pgdata:
