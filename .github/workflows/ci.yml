name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --no-coverage --forceExit
        env:
          NODE_ENV: test
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  optimizer:
    name: Optimizer Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: optimizer/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/unit/ -x -q
        env:
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0

  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
