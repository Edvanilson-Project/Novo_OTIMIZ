name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  # ── Backend — NestJS + Postgres real ─────────────────────────────────────────
  backend:
    name: Backend Tests (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otimiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_test

      - name: Test migration rollback
        run: npm run migration:revert && npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_test

      - name: Run tests
        run: npm test -- --no-coverage --forceExit
        env:
          NODE_ENV: test
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otimiz_test

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  # ── Optimizer — suite completa (unit + integration + GTFS real) ───────────────
  optimizer:
    name: Optimizer Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: optimizer/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Run full test suite
        run: python -m pytest tests/ -q --timeout=120 -m "not slow"
        env:
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0

  # ── Frontend — TypeScript + build ────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ── E2E Playwright — stack completa ──────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, optimizer, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otimiz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: optimizer/requirements*.txt

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend migrations
        working-directory: backend
        run: npm run migration:run
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_e2e

      - name: Start backend
        working-directory: backend
        run: npm run start &
        env:
          NODE_ENV: production
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_e2e
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otimiz_e2e
          JWT_SECRET: ci-e2e-jwt-secret-change-in-production-min32
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum
          OPTIMIZER_URL: http://localhost:8000

      # ── Optimizer ─────────────────────────────────────────────────────────────
      - name: Install optimizer dependencies
        working-directory: optimizer
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start optimizer
        working-directory: optimizer
        run: uvicorn src.main:app --host 0.0.0.0 --port 8000 &
        env:
          INTERNAL_OPTIMIZER_KEY: ci-test-strong-key-32chars-minimum
          DATABASE_URL: sqlite:///./e2e.db
          REDIS_URL: redis://localhost:6379/0

      # ── Frontend ──────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

      - name: Start frontend
        working-directory: frontend
        run: npm start &
        env:
          PORT: 3000

      # ── Wait for all services ─────────────────────────────────────────────────
      - name: Wait for services
        run: |
          set -e

          TIMEOUT_SECONDS=300
          START_TIME=$(date +%s)

          check_elapsed() {
            local elapsed=$(($(date +%s) - START_TIME))
            if [ $elapsed -gt $TIMEOUT_SECONDS ]; then
              echo "❌ Timeout waiting for services after ${elapsed}s"
              echo ""
              echo "=== Service Status ==="
              ps aux | grep -E 'npm|uvicorn|node' | grep -v grep || true
              echo ""
              echo "=== Network Connections ==="
              netstat -tlnp 2>/dev/null | grep -E ':(3001|8000|3000|5432)' || true
              exit 1
            fi
          }

          # Wait for Postgres
          echo "⏳ Waiting for Postgres..."
          until psql -h localhost -U postgres -d postgres -c "SELECT 1" > /dev/null 2>&1; do
            check_elapsed
            echo "   ... retrying ($(( $(date +%s) - START_TIME ))s elapsed)"
            sleep 2
          done
          echo "✓ Postgres ready"

          # Wait for backend
          echo "⏳ Waiting for backend (http://localhost:3001/api/v1/health)..."
          until curl -sf http://localhost:3001/api/v1/health > /dev/null 2>&1; do
            check_elapsed
            echo "   ... retrying ($(( $(date +%s) - START_TIME ))s elapsed)"
            sleep 2
          done
          echo "✓ Backend ready"

          # Wait for optimizer
          echo "⏳ Waiting for optimizer (http://localhost:8000/health)..."
          until curl -sf http://localhost:8000/health > /dev/null 2>&1; do
            check_elapsed
            echo "   ... retrying ($(( $(date +%s) - START_TIME ))s elapsed)"
            sleep 2
          done
          echo "✓ Optimizer ready"

          # Wait for frontend
          echo "⏳ Waiting for frontend (http://localhost:3000)..."
          until curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; do
            check_elapsed
            echo "   ... retrying ($(( $(date +%s) - START_TIME ))s elapsed)"
            sleep 2
          done
          echo "✓ Frontend ready"

          echo ""
          echo "✅ All services ready in $(( $(date +%s) - START_TIME ))s"
        timeout-minutes: 6

      - name: Diagnose failed services
        if: failure()
        run: |
          echo "=== Running Processes ==="
          ps aux | grep -E 'npm|uvicorn|node|postgres' | grep -v grep || echo "No processes found"

          echo ""
          echo "=== Open Ports ==="
          netstat -tlnp 2>/dev/null || ss -tlnp 2>/dev/null || echo "netstat/ss not available"

          echo ""
          echo "=== Backend Process Log ==="
          ps aux | grep "npm run start" | grep -v grep || echo "Backend not running"

          echo ""
          echo "=== Optimizer Process Log ==="
          ps aux | grep "uvicorn" | grep -v grep || echo "Optimizer not running"

          echo ""
          echo "=== Backend Connection Test ==="
          curl -v http://localhost:3001/api/v1/health 2>&1 | head -20 || echo "Backend unreachable"

          echo ""
          echo "=== Optimizer Connection Test ==="
          curl -v http://localhost:8000/health 2>&1 | head -20 || echo "Optimizer unreachable"

          echo ""
          echo "=== Postgres Connection Test ==="
          psql -h localhost -U postgres -d postgres -c "SELECT version();" 2>&1 || echo "Postgres unreachable"

      # ── Seed admin + demo data ────────────────────────────────────────────────
      - name: Seed E2E data
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register src/database/seeds/seed-e2e.ts
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: otimiz_e2e

      # ── Playwright ────────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test e2e/smoke.spec.ts e2e/flows.spec.ts
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
