groups:
  - name: otimiz.optimizer
    rules:
      - alert: OptimizerDown
        expr: up{job="optimizer"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Optimizer service is down"
          description: "The optimizer FastAPI service has been unreachable for more than 1 minute."

      - alert: OptimizerHighErrorRate
        expr: |
          rate(http_requests_total{job="optimizer", status=~"5.."}[5m])
          / rate(http_requests_total{job="optimizer"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Optimizer error rate > 5%"
          description: "Optimizer 5xx rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: OptimizerHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="optimizer"}[5m])
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Optimizer P95 latency > 30s"
          description: "P95 request latency is {{ $value | humanizeDuration }}."

      - alert: CeleryQueueDepth
        expr: celery_queue_length > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue depth > 20"
          description: "Too many pending optimization tasks ({{ $value }}). Workers may be stuck."

  - name: otimiz.backend
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend NestJS service is down"

      - alert: BackendHighErrorRate
        expr: |
          rate(http_requests_total{job="backend", status=~"5.."}[5m])
          / rate(http_requests_total{job="backend"}[5m]) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend error rate > 2%"
          description: "Backend 5xx rate is {{ $value | humanizePercentage }}."

  - name: otimiz.database
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count > 80"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"

  - name: otimiz.infrastructure
    rules:
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space < 15%"
          description: "Available: {{ $value | humanizePercentage }}."

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage > 90%"
