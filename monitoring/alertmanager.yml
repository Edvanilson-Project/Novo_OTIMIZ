global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT:-587}'
  smtp_from: '${SMTP_FROM:-alertmanager@otimiz.com.br}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'

route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning-alerts
      repeat_interval: 6h

receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERT_EMAIL:-admin@otimiz.com.br}'
        send_resolved: true
        html: |
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b><br>
          {{ .Annotations.description }}<br>
          Status: {{ .Status }}<br>
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL:-admin@otimiz.com.br}'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERT_EMAIL:-admin@otimiz.com.br}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
